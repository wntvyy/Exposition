[package]
name = "exposition-execution"
description = "Execution service: toolchain discovery, validated process launch, clean environments, process-tree containment, bounded/redacted logs, trust and restricted (container) execution policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
exposition-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
tokio.workspace = true
uuid.workspace = true
regex.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Deterministic process-tree fixture used by the integration tests (spawns
# descendants, prints its environment, floods output, exits with given codes).
# It is never launched by the application itself.
[[bin]]
name = "exposition-testproc"
path = "src/bin/testproc.rs"
test = false
doc = false

[lints]
workspace = true
