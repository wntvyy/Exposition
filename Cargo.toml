[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
exposition-core = { path = "crates/exposition-core" }
exposition-workspace = { path = "crates/exposition-workspace" }
exposition-execution = { path = "crates/exposition-execution" }
exposition-tex = { path = "crates/exposition-tex" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tracing = "0.1"
tempfile = "3"
regex = "1"
# Execution service OS integration (process-tree containment).
libc = "0.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
# PDF rendering and glyph-level interpretation (TeX page mapping).
hayro = "0.9"
flate2 = "1"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

# Typst, PDF interpretation, and other compute-heavy dependencies are far too slow
# unoptimized; optimize dependencies in dev builds while keeping workspace crates
# fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
