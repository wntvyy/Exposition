name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows is the primary verified platform. Other platforms are structurally
    # supported but unverified until they have their own runner job.
    runs-on: windows-latest
    # A cold Rust build plus the full check takes about an hour; a cached run about 25 minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      # The toolchain pinned in rust-toolchain.toml (the same one local checks use).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      # Save the build cache after a failed check too, so one failure does not
      # leave every later run building from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
      - run: npm run check
