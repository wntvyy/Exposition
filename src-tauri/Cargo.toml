[package]
name = "exposition"
description = "Exposition desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "exposition"

[lib]
name = "exposition_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
exposition-core.workspace = true
exposition-workspace.workspace = true
exposition-agents.workspace = true
exposition-execution.workspace = true
exposition-research.workspace = true
exposition-attach.workspace = true
exposition-tex.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
ts-rs.workspace = true
